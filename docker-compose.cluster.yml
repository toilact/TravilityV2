# Cụm phân tán (spec scale §4). T4: db + redis + llm-gateway + 2 api + 2 planner + 3 planner-agent + nginx.
# Dùng chung cổng 5432/6379/8000 với docker-compose.yml → `docker compose down` trước khi bật cụm.
name: travility-cluster
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: travility
      POSTGRES_PASSWORD: travility
      POSTGRES_DB: travility
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travility"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  llm-gateway:
    build: ./server
    command: ["uv", "run", "--no-dev", "uvicorn", "app.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ./server/.env  # LLM_* / EMBED_* ở đây là provider thật
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_CACHE: ${GATEWAY_CACHE:-on}
      GATEWAY_CHAT_TTL: ${GATEWAY_CHAT_TTL:-86400}
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      redis:
        condition: service_healthy
  api:
    build: ./server
    env_file: ./server/.env
    environment: &app_env
      DATABASE_URL: postgresql://travility:travility@db:5432/travility
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://llm-gateway:8000/v1
      EMBED_BASE_URL: http://llm-gateway:8000/v1
      DEMO_TODAY: ${DEMO_TODAY:-}
      PLAN_RPM: ${PLAN_RPM:-5}
      PLANNER_MODE: ${PLANNER_MODE:-single}
    deploy:
      replicas: 2
    depends_on: &app_deps
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
  planner:
    build: ./server
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    env_file: ./server/.env
    environment: *app_env
    deploy:
      replicas: 2
    depends_on: *app_deps
  planner-agent:  # agent chuyên gia của lập lịch đa agent (PLANNER_MODE=multi); đọc stream agent_jobs
    build: ./server
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker", "--stream", "agent_jobs"]
    env_file: ./server/.env
    environment: *app_env
    deploy:
      replicas: 3
    depends_on: *app_deps
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8000:80"]
    depends_on: [api]
volumes:
  pgdata: {}
  redisdata: {}
